; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env_common_esp32]
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
upload_resetmethod = nodemcu
# board_build.partitions = min_spiffs.csv

[env:esp32-s3-supermini]
board = lolin_s3_mini
extends = env_common_esp32

lib_deps =
    # Thư viện WiFi và Bluetooth đã tích hợp sẵn trong framework Espressif32
    # Bạn chỉ cần đảm bảo framework đã được cài đặt.

    # Thư viện FastLED cho việc điều khiển đèn LED
    fastled/FastLED@^3.9.9
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library @ ^1.12.1
    WiFiManager@^2.0.17
build_flags = -D ARDUINO_USB_CDC_ON_BOOT #là lệnh để nói với trình biên dịch rằng "hãy bật tính năng Serial qua USB ngay khi bo mạch khởi động".